version: 2
updates:
  - package-ecosystem: pip
    directory: /Backend
    target-branch: Backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: Backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /Backend
    target-branch: Backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
