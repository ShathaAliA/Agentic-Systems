name: Security scans
on:
  pull_request:
    branches: [Backend]
  push:
    branches: [Backend]
  schedule:
    - cron: '0 5 * * 1'  # weekly: new advisories appear without any code change
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL -o gitleaks.tar.gz "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${version}_checksums.txt"
          grep "gitleaks_${version}_linux_x64.tar.gz" checksums.txt | awk '{print $1 "  gitleaks.tar.gz"}' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history (secret values are redacted in the log)
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install the exact test environment and the auditor
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements-test.txt pip-audit==2.10.1
      - name: Audit installed packages (waivers must be valid and unexpired)
        run: python Backend/tools/run-pip-audit.py
